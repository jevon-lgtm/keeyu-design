<!-- @dsCard group="Components" name="Graphic well" subtitle="#F9F9F9, hair stroke, radius 22, 1072 wide, 44 padding" width="1240" height="435" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graphic well</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,300&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<style>
:root{
  --ink:#000000; --strong:#1A1A1A; --body:#4D5454; --soft:#797E82; --muted:#9AA0A6;
  --rule:#E0E0E0; --hair:#ECECEC; --track:#EFEFEF; --card-border:#EAEAEA;
  --well:#F9F9F9; --connector:#CBCBCB; --paper:#FAFAFA;
  --coral-light:#FCA694; --coral:#F6816A; --teal-light:#5FBEC8; --teal:#3FA7B7;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--paper); color:var(--body);
      font-family:'Geist',-apple-system,'Segoe UI',sans-serif; font-weight:400;
      font-size:15px; line-height:1.4; letter-spacing:-0.002em; }
.sheet{ padding:84px; position:relative; }
.serif{ font-family:'Roboto Serif',Georgia,'Times New Roman',serif; font-weight:300;
        letter-spacing:-0.002em; color:var(--ink); }
h1{ font-family:'Roboto Serif',Georgia,serif; font-weight:300; font-size:72px;
    line-height:1.12; letter-spacing:-0.002em; color:var(--ink); }
h2{ font-family:'Roboto Serif',Georgia,serif; font-weight:300; font-size:40px;
    line-height:1.24; letter-spacing:-0.002em; color:var(--ink); }
h3{ font-family:'Roboto Serif',Georgia,serif; font-weight:300; font-size:32px;
    line-height:1.24; color:var(--ink); }
.cap{ font-family:'Roboto Serif',Georgia,serif; font-weight:300; font-size:19.4px;
      line-height:1.24; color:var(--ink); }
.note{ font-size:14px; line-height:1.5; color:var(--muted); }
.lead{ font-size:17px; line-height:1.4; color:var(--body); }
hr{ border:0; border-top:1px solid var(--rule); }
hr.hair{ border-top-color:var(--hair); }
a{ color:#3FA7B7; } a:hover{ color:#2F8794; }

.hero{ position:absolute; left:-100px; top:-329px; width:1440px; height:684px;
       overflow:hidden; background:var(--paper); z-index:0; }
.hero::before{ content:""; position:absolute; top:0; left:-100px; width:1751px; height:684px;
  filter:blur(53px); opacity:.8;
  background:
    linear-gradient(180deg, #FAFAFA 0%, #FAFAFA 19%, rgba(250,250,250,.78) 28%,
      rgba(250,250,250,.38) 40%, rgba(250,250,250,0) 48%,
      rgba(250,250,250,.18) 70%, rgba(250,250,250,.86) 84%, #FAFAFA 90%),
    linear-gradient(92.24deg, #FF5331 0.07%, #FCE1DA 38.25%, #9CDFF3 75.92%, #D8F6FF 89.42%); }
.dots{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.dots::before{ content:""; position:absolute; inset:0;
  background-image:radial-gradient(circle at 1.5px 1.5px, rgba(0,0,0,.08) 1.5px, rgba(0,0,0,0) 1.6px);
  background-size:20px 20px;
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.06) 35%, rgba(0,0,0,.225) 70%, rgba(0,0,0,.5) 100%);
          mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.06) 35%, rgba(0,0,0,.225) 70%, rgba(0,0,0,.5) 100%); }

.card{ width:1240px; min-height:435px; position:relative; padding:56px; background:var(--paper); }
.spec{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.spec > div{ display:flex; justify-content:space-between; border-bottom:1px solid var(--hair); padding-bottom:10px; }
.spec > div:last-child{ border-bottom:0; }
.spec .v{ color:var(--strong); }
</style>
</head>
<body>
<div class="card">
  <div class="dots"></div>
  <div style="position:relative;z-index:1">
    <h3 style="font-size:32px">Graphic well</h3>
    <div style="width:1072px;background:#F9F9F9;border:1px solid #ECECEC;border-radius:22px;padding:44px;margin-top:24px"><div style="display:flex;flex-direction:column;gap:20px"><div style="display:flex;align-items:center;gap:20px"><span style="width:250px;flex:none;font-size:15px;color:var(--strong)">Keeyu builds the integration</span><span style="flex-grow:1;height:30px;border-radius:10px;background:#EFEFEF;position:relative"><span style="position:absolute;top:0;bottom:0;left:0;width:100%;border-radius:10px;background:linear-gradient(90deg,#5FBEC8,#3FA7B7);box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 10px 20px -8px rgba(63,167,183,.55)"></span></span><span style="width:184px;flex:none;font-size:14px;color:var(--muted)">5 to 10 working days</span></div><div style="display:flex;align-items:center;gap:20px"><span style="width:250px;flex:none;font-size:15px;color:var(--strong)">Your team shares credentials</span><span style="flex-grow:1;height:30px;border-radius:10px;background:#EFEFEF;position:relative"><span style="position:absolute;top:0;bottom:0;left:0;width:4%;border-radius:10px;background:linear-gradient(90deg,#5FBEC8,#3FA7B7);box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 10px 20px -8px rgba(63,167,183,.55)"></span></span><span style="width:184px;flex:none;font-size:14px;color:var(--muted)">2 to 3 hours</span></div></div><p style="font-size:14px;color:var(--muted);margin-top:28px">Widths are set as percentages so the ratio is the claim. The graphic is the argument.</p></div>
    <p class="note" style="margin-top:20px;max-width:900px">Containers are for graphics only. Prose never sits in a card, a well, a pill or a tinted panel.</p>
  </div>
</div>
</body>
</html>
